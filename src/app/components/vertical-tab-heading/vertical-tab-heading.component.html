<h1 class="bg-primary text-white text-center p-2">Tab Heading Tasks</h1>

<h3 class="bg-primary text-white text-center text-capitalize p-2 mb-4 mt-4">vertical tab example</h3>
<div class="container mt-5">
    <div class="row">
        <div class="col-2 offset-md-2">
            <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist" aria-orientation="vertical">
                <button class="nav-link mb-2" id="v-pills-home-tab" data-toggle="pill" data-target="#v-pills-home"
                    type="button" role="tab" aria-controls="v-pills-home" aria-selected="true"
                    *ngFor="let title of backendSkills"
                    [ngClass]="{
                        active : selectedSkill.toLowerCase().includes(title.title.toLowerCase())
                    }"
                    (click) = "onSkillChange(title.title)"
                    >{{title.title}}</button>

            </div>
        </div>
        <div class="col-md-6">
            <div class="tab-content" id="v-pills-tabContent">
                <p class="tab-pane fade" id="v-pills-home" role="tabpanel"
                    aria-labelledby="v-pills-home-tab" 
                    *ngFor="let con of backendSkills" 
                    [innerHTML]="con.content"
                    [ngClass]="{
                        'show active' : selectedSkill.toLowerCase().includes(con.title.toLowerCase())
                    }"
                    >
                </p>
            </div>
        </div>
    </div>
</div>


<hr class="mt-5" style="height: 3px" color="red" />
